<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实时视频</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/player.js" defer></script>
</head>
<body>
  <main>
    <header><h1>实时视频</h1></header>
    <form id="connect-form">
      <label for="token">访问令牌</label>
      <input id="token" type="password" autocomplete="off" required>
      <button id="connect" type="submit">开始观看</button>
      <button id="disconnect" type="button" disabled>停止观看</button>
    </form>
    <p id="status" role="status">未连接</p>
    <p id="source" hidden></p>
    <video id="video" autoplay playsinline muted controls></video>
  </main>
</body>
</html>
