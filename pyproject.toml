[project]
name = "carstream"
version = "0.1.0"
description = "Single-camera RTSP to WebRTC gateway for RK3588"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.14.5",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]
