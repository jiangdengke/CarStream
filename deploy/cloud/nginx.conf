worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 128k;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    limit_req_zone $binary_remote_addr zone=signaling:1m rate=12r/m;

    server {
        listen 7777 ssl;
        server_name 8.130.208.68;
        ssl_certificate /etc/carstream/tls/server.crt;
        ssl_certificate_key /etc/carstream/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        # Keep the old private/weak-token backend unreachable during deployment.
        if (!-f /etc/carstream/backend-ready) {
            return 503;
        }

        location ~ ^/(|player\.js|style\.css|healthz|ws)$ {
            limit_req zone=signaling burst=15 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:17777;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 60s;
        }

        location / {
            return 404;
        }
    }
}
